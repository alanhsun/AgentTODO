services:
  agenttodo:
    image: alansundy/agenttodo:latest
    build: .
    container_name: agenttodo
    restart: unless-stopped
    ports:
      - "3300:3300"
    volumes:
      - task-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3300
      - AGENTTODO_URL=http://localhost:3300/api
      - DB_PATH=/data/tasks.db
      # 时区决定"今天/逾期"的判断以及每日逾期检查的触发时间，请按实际所在地修改
      - TZ=Asia/Shanghai
      # 逾期检查 cron（默认每天 9:00）
      - OVERDUE_CRON=0 9 * * *
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3300/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  task-data:
    driver: local
