services:
  agenttodo:
    image: alansundy/agenttodo:latest
    build: .
    container_name: agenttodo
    restart: unless-stopped
    ports:
      - "3300:3300"
    volumes:
      - task-data:/data
    environment:
      - NODE_ENV=production
      # Docker 端口映射用于局域网访问；直接 npm 启动默认只监听 127.0.0.1。
      - HOST=0.0.0.0
      - PORT=3300
      - AGENTTODO_URL=http://localhost:3300/api
      - DB_PATH=/data/tasks.db
      - ATTACHMENT_DIR=/data/attachments
      - ATTACHMENT_MAX_SIZE_MB=${ATTACHMENT_MAX_SIZE_MB:-20}
      - BACKUP_MAX_SIZE_MB=${BACKUP_MAX_SIZE_MB:-1024}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Shanghai}
      # 留空保持原有零认证模式；在非完全可信的局域网中建议设置长随机值。
      - API_TOKEN=${API_TOKEN:-}
      - API_USERNAME=${API_USERNAME:-agenttodo}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - JSON_BODY_LIMIT=${JSON_BODY_LIMIT:-50mb}
      - AGENTTODO_API_TOKEN=${API_TOKEN:-}
      # 本项目的 Webhook 通常指向局域网 AI 服务，因此在 Compose 中显式保留该能力。
      - WEBHOOK_ALLOW_PRIVATE_NETWORK=${WEBHOOK_ALLOW_PRIVATE_NETWORK:-true}
      - WEBHOOK_ALLOWED_HOSTS=${WEBHOOK_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3300/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  task-data:
    driver: local
