openapi: 3.0.3
info:
  title: AgentTODO API
  description: >
    <!-- @purpose -->AI 驱动的本地优先任务系统 RESTful API，支持可信网络免认证或可选 API Token，无缝对接 AI 助手和命令行技能系统。<!-- /purpose -->
  version: 1.1.0
  contact:
    name: AgentTODO
  license:
    name: MIT
    url: https://github.com/alanhsun/AgentTODO/blob/main/LICENSE
servers:
  - url: http://localhost:3300
    description: Docker/生产服务，或本地 Vite API 代理
  - url: http://127.0.0.1:3301
    description: 本地开发后端

# API_TOKEN 未设置时允许匿名访问；设置后使用以下任一认证方式。
security:
  - bearerToken: []
  - basicAuth: []
  - apiTokenHeader: []
  - {}

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
    apiTokenHeader:
      type: apiKey
      in: header
      name: X-API-Token

  schemas:
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        task_count:
          type: integer

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date:
          type: string
          format: date
          nullable: true
          description: 普通任务日期；重复任务的包含式结束日期。为空时重复任务持续发生。
        recurrence:
          type: string
          enum: [none, daily, weekdays, weekly, monthly]
          description: 重复从 created_at 所在日期开始；weekdays 表示周一至周五。
        recurrence_end:
          type: string
          format: date
          nullable: true
          deprecated: true
          description: 旧版兼容字段；新客户端使用 due_date 作为重复结束日期。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        subtask_progress:
          type: object
          nullable: true
          properties:
            total: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
        attachment_count:
          type: integer
          minimum: 0
        agenda_type:
          type: string
          enum: [today, overdue]
        occurrence_date:
          type: string
          format: date
          nullable: true
        occurrence_completed:
          type: boolean

    Subtask:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        title: { type: string }
        completed: { type: boolean }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        original_name: { type: string }
        mime_type: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        created_at: { type: string, format: date-time }
        download_url: { type: string }
        preview_url: { type: string, nullable: true }

    TaskNote:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        content: { type: string }
        source: { type: string, enum: [user, ai] }
        created_at: { type: string, format: date-time }

    TaskOccurrence:
      type: object
      properties:
        task_id: { type: integer }
        occurrence_date: { type: string, format: date }
        completed_at: { type: string, format: date-time }
        source: { type: string, enum: [user, ai] }

    TaskContext:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            subtasks:
              type: array
              items: { $ref: '#/components/schemas/Subtask' }
            notes:
              type: array
              items: { $ref: '#/components/schemas/TaskNote' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
            recent_occurrences:
              type: array
              items: { $ref: '#/components/schemas/TaskOccurrence' }

    TaskProgressInput:
      type: object
      anyOf:
        - required: [note_content]
        - required: [complete_subtasks]
        - required: [task_status]
        - required: [occurrence_date, occurrence_completed]
      properties:
        note_content: { type: string, maxLength: 10000 }
        complete_subtasks:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        task_status: { type: string, enum: [todo, in_progress, done] }
        occurrence_date: { type: string, format: date }
        occurrence_completed: { type: boolean }
        source: { type: string, enum: [user, ai], default: ai }
        request_id:
          type: string
          maxLength: 100
          description: 幂等调用 ID；同一次网络重试必须复用。

    Webhook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    TaskCreateInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
          default: todo
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        due_date:
          type: string
          format: date
          nullable: true
          description: 重复任务的包含式结束日期；为空时持续发生。
        recurrence:
          type: string
          enum: [none, daily, weekdays, weekly, monthly]
          default: none
          description: 从任务创建日期开始计算。
        recurrence_end:
          type: string
          format: date
          nullable: true
          deprecated: true
          description: 旧版兼容字段；新客户端使用 due_date。
        tags:
          type: array
          items:
            type: integer
          uniqueItems: true
        subtasks:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                required: [title]
                properties:
                  title: { type: string, maxLength: 255 }

    TaskUpdateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date:
          type: string
          format: date
          nullable: true
        recurrence:
          type: string
          enum: [none, daily, weekdays, weekly, monthly]
        recurrence_end:
          type: string
          format: date
          nullable: true
          deprecated: true
          description: 旧版兼容字段；新客户端使用 due_date。
        tags:
          type: array
          items:
            type: integer
          uniqueItems: true

    BatchInput:
      type: object
      required: [action, ids]
      properties:
        action:
          type: string
          enum: [update_status, update_priority, delete]
        ids:
          type: array
          items:
            type: integer
          minItems: 1
        value:
          type: string
          description: 新的状态或优先级值（action为delete时不需要）

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /api/health:
    get:
      summary: 健康检查
      tags: [System]
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api/tasks/summary:
    get:
      summary: 获取任务统计概览
      tags: [Tasks]
      responses:
        '200':
          description: 全局任务统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  by_status:
                    type: object
                    additionalProperties: { type: integer }
                  overdue: { type: integer }
                  due_today: { type: integer }
                  completed_today: { type: integer }
                  by_priority:
                    type: object
                    additionalProperties: { type: integer }
                  date: { type: string, format: date }

  /api/tasks/today:
    get:
      summary: 获取今日及逾期任务
      tags: [Tasks]
      responses:
        '200':
          description: 今日任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }

  /api/tasks/overdue:
    get:
      summary: 获取逾期任务
      tags: [Tasks]
      responses:
        '200':
          description: 逾期任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }

  /api/tasks:
    get:
      summary: 获取任务列表
      tags: [Tasks]
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: "按状态筛选，多个用逗号分隔 (todo,in_progress,done)"
        - name: priority
          in: query
          schema:
            type: string
          description: "按优先级筛选，多个用逗号分隔"
        - name: tag
          in: query
          schema:
            type: string
          description: "按标签ID筛选，多个用逗号分隔"
        - name: search
          in: query
          schema:
            type: string
          description: 搜索标题和描述
        - name: due_before
          in: query
          schema:
            type: string
            format: date
          description: 截止日期早于
        - name: due_after
          in: query
          schema:
            type: string
            format: date
          description: 截止日期晚于
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, due_date, priority, title, status]
            default: created_at
          description: 排序字段
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: 排序方向
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: 页码
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: 每页条数
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      summary: 创建任务
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string

  /api/tasks/{id}:
    get:
      summary: 获取单个任务
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: 更新任务
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: 删除任务
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tasks/{id}/context:
    get:
      summary: 获取 AI 紧凑任务上下文
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 任务、子任务、笔记、附件元数据和近期重复完成记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskContext' }
        '404':
          description: 任务不存在

  /api/tasks/{id}/progress:
    post:
      summary: 原子记录任务进展
      description: 笔记、子任务、主状态和某次重复任务完成状态在同一事务内更新；request_id 用于安全重试。
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskProgressInput' }
      responses:
        '200':
          description: 更新成功或幂等重放成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  duplicate: { type: boolean }
                  task: { $ref: '#/components/schemas/TaskContext' }
        '400':
          description: 参数、子任务或重复日期无效
        '404':
          description: 任务不存在

  /api/tasks/batch:
    post:
      summary: 批量操作
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInput'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  affected:
                    type: integer
        '400':
          description: 参数错误

  /api/tasks/{taskId}/subtasks:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: 获取子任务
      tags: [Subtasks]
      responses:
        '200':
          description: 子任务列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subtask' }
    post:
      summary: 新增子任务
      tags: [Subtasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 255 }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subtask' }

  /api/tasks/{taskId}/subtasks/{id}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: 更新子任务
      tags: [Subtasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
                completed: { type: boolean }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subtask' }
    delete:
      summary: 删除子任务
      tags: [Subtasks]
      responses:
        '200': { description: 删除成功 }

  /api/tasks/{taskId}/attachments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: 获取任务附件
      tags: [Attachments]
      responses:
        '200':
          description: 附件元数据列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '404': { description: 任务不存在 }
    post:
      summary: 上传任务附件
      description: 单文件大小由 ATTACHMENT_MAX_SIZE_MB 控制，默认 20 MB。
      tags: [Attachments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { description: 文件缺失、格式错误或超过大小限制 }
        '404': { description: 任务不存在 }

  /api/tasks/{taskId}/attachments/{attachmentId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
      - name: attachmentId
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: 删除附件
      tags: [Attachments]
      responses:
        '200': { description: 删除成功 }
        '404': { description: 任务或附件不存在 }

  /api/tasks/{taskId}/attachments/{attachmentId}/download:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
      - name: attachmentId
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: 下载附件
      tags: [Attachments]
      responses:
        '200':
          description: 附件二进制内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: 任务、附件或文件不存在 }

  /api/tasks/{taskId}/attachments/{attachmentId}/preview:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
      - name: attachmentId
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: 预览安全位图附件
      description: 仅支持 JPEG、PNG、GIF 和 WebP；SVG 等其他类型必须下载。
      tags: [Attachments]
      responses:
        '200':
          description: 图片内容
          content:
            image/png:
              schema: { type: string, format: binary }
        '415': { description: 不支持安全内嵌预览 }

  /api/tasks/{taskId}/notes:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: 获取任务纪要
      tags: [Notes]
      responses:
        '200':
          description: 纪要列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskNote' }
    post:
      summary: 新增任务纪要
      tags: [Notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                source: { type: string, enum: [user, ai], default: user }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNote' }

  /api/tasks/{taskId}/notes/{id}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: 删除任务纪要
      tags: [Notes]
      responses:
        '200': { description: 删除成功 }

  /api/tags:
    get:
      summary: 获取标签列表
      tags: [Tags]
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

    post:
      summary: 创建标签
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                color:
                  type: string
                  pattern: '^#[0-9a-fA-F]{6}$'
                  default: '#6366f1'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '409':
          description: 标签名已存在

  /api/tags/{id}:
    put:
      summary: 更新标签
      tags: [Tags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '404':
          description: 标签不存在

    delete:
      summary: 删除标签
      tags: [Tags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
        '404':
          description: 标签不存在

  /api/webhooks:
    get:
      summary: 获取 Webhook 列表
      tags: [Webhooks]
      responses:
        '200':
          description: Webhook 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
    post:
      summary: 注册 Webhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, maxLength: 100 }
                url: { type: string, format: uri, maxLength: 2048 }
                events:
                  type: array
                  items:
                    type: string
                    enum: [task.created, task.updated, task.overdue, '*']
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '400': { description: URL、主机或事件配置无效 }

  /api/backup/export:
    get:
      summary: 导出旧版 JSON 备份（不含附件文件）
      tags: [Backup]
      responses:
        '200':
          description: 版本化备份对象
          content:
            application/json:
              schema:
                type: object
                required: [version, timestamp, data]
                properties:
                  version: { type: integer, enum: [1] }
                  timestamp: { type: string, format: date-time }
                  attachments_omitted: { type: integer, minimum: 0 }
                  data: { type: object }

  /api/backup/import:
    post:
      summary: 导入旧版 JSON 备份
      description: 在单个数据库事务中替换现有数据；JSON 不含二进制文件，因此现有附件会被移除。
      tags: [Backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, data]
              properties:
                version: { type: integer, enum: [1] }
                data: { type: object }
      responses:
        '200': { description: 导入成功 }
        '400': { description: 备份格式无效 }

  /api/backup/export.zip:
    get:
      summary: 导出包含附件的 ZIP 完整备份
      tags: [Backup]
      responses:
        '200':
          description: AgentTODO 完整备份压缩包
          content:
            application/zip:
              schema: { type: string, format: binary }

  /api/backup/import.zip:
    post:
      summary: 恢复包含附件的 ZIP 完整备份
      description: 校验清单、文件大小和 SHA-256 后，替换数据库与附件目录。
      tags: [Backup]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup: { type: string, format: binary }
      responses:
        '200': { description: 完整恢复成功 }
        '400': { description: 压缩包、清单或附件校验失败 }
