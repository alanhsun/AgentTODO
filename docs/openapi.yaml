openapi: 3.0.3
info:
  title: AgentTODO API
  description: >
    <!-- @purpose -->AI 驱动的任务系统 RESTful API，专为本地私有化 (Zero-Auth) 环境设计，无缝对接 AI 助手和命令行技能系统。<!-- /purpose -->
  version: 1.1.0
  contact:
    name: AgentTODO
servers:
  - url: http://localhost:3300
    description: 本地开发

tags:
  - name: AI
    description: 面向 AI 助手的聚合查询
  - name: Tasks
  - name: Subtasks
  - name: Notes
  - name: Tags
  - name: Webhooks
  - name: System

components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TaskIdForChildren:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
    ChildId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        task_count:
          type: integer

    SubtaskProgress:
      type: object
      nullable: true
      properties:
        total:
          type: integer
        completed:
          type: integer

    Subtask:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time

    Note:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        content:
          type: string
        source:
          type: string
          example: ai
        created_at:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date:
          type: string
          format: date
          nullable: true
        recurrence:
          type: string
          enum: [none, daily, weekly, monthly]
        recurrence_end:
          type: string
          format: date
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        subtask_progress:
          $ref: '#/components/schemas/SubtaskProgress'

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            subtasks:
              type: array
              items:
                $ref: '#/components/schemas/Subtask'
            notes:
              type: array
              items:
                $ref: '#/components/schemas/Note'
            next_occurrence:
              type: object
              description: 仅在周期任务被标记完成时出现，表示自动生成的下一次实例
              properties:
                id:
                  type: integer
                due_date:
                  type: string
                  format: date

    TaskCreateInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
          default: todo
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        due_date:
          type: string
          format: date
          nullable: true
        recurrence:
          type: string
          enum: [none, daily, weekly, monthly]
          default: none
        recurrence_end:
          type: string
          format: date
          nullable: true
        tags:
          type: array
          items:
            type: integer
        subtasks:
          type: array
          items:
            type: string

    TaskUpdateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date:
          type: string
          format: date
          nullable: true
        recurrence:
          type: string
          enum: [none, daily, weekly, monthly]
        recurrence_end:
          type: string
          format: date
          nullable: true
        tags:
          type: array
          description: 整体替换任务的标签
          items:
            type: integer

    BatchInput:
      type: object
      required: [action, ids]
      properties:
        action:
          type: string
          enum: [update_status, update_priority, delete]
        ids:
          type: array
          items:
            type: integer
          minItems: 1
        value:
          type: string
          description: 新的状态或优先级值（action为delete时不需要）

    Webhook:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
            enum: [task.created, task.updated, task.completed, task.deleted, task.overdue, '*']
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: string

paths:
  /api/health:
    get:
      summary: 健康检查
      tags: [System]
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api/tasks/summary:
    get:
      summary: 全局任务统计（服务器本地时区）
      tags: [AI]
      responses:
        '200':
          description: 统计信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  by_status:
                    type: object
                    properties:
                      todo:
                        type: integer
                      in_progress:
                        type: integer
                      done:
                        type: integer
                  overdue:
                    type: integer
                  due_today:
                    type: integer
                  completed_today:
                    type: integer
                  by_priority:
                    type: object
                    properties:
                      urgent:
                        type: integer
                      high:
                        type: integer
                  date:
                    type: string
                    format: date

  /api/tasks/today:
    get:
      summary: 今日到期 + 逾期的未完成任务（含子任务列表）
      tags: [AI]
      responses:
        '200':
          description: 今日议程
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  tasks:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Task'
                        - type: object
                          properties:
                            is_overdue:
                              type: boolean
                            subtasks:
                              type: array
                              items:
                                $ref: '#/components/schemas/Subtask'

  /api/tasks/overdue:
    get:
      summary: 逾期的未完成任务
      tags: [AI]
      responses:
        '200':
          description: 逾期任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

  /api/tasks:
    get:
      summary: 获取任务列表
      tags: [Tasks]
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: "按状态筛选，多个用逗号分隔 (todo,in_progress,done)"
        - name: priority
          in: query
          schema:
            type: string
          description: "按优先级筛选，多个用逗号分隔"
        - name: tag
          in: query
          schema:
            type: string
          description: "按标签ID筛选，多个用逗号分隔（匹配任意一个）"
        - name: search
          in: query
          schema:
            type: string
          description: 搜索标题和描述
        - name: due_before
          in: query
          schema:
            type: string
            format: date
          description: 截止日期不晚于
        - name: due_after
          in: query
          schema:
            type: string
            format: date
          description: 截止日期不早于
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, due_date, priority, title, status]
            default: created_at
          description: 排序字段（priority 按业务优先级排序；due_date 排序时无日期的任务在最后）
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: 排序方向
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: 页码
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 500
          description: 每页条数
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      summary: 创建任务
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/tasks/{id}:
    get:
      summary: 获取任务详情（含子任务与笔记）
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: 更新任务（局部更新；周期任务完成时自动生成下一次实例）
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: 删除任务（级联删除子任务、笔记、标签关联）
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/batch:
    post:
      summary: 批量操作
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInput'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  affected:
                    type: integer
                  not_found:
                    type: array
                    items:
                      type: integer
                  next_occurrences:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        due_date:
                          type: string
                          format: date
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{taskId}/subtasks:
    get:
      summary: 获取子任务列表
      tags: [Subtasks]
      parameters:
        - $ref: '#/components/parameters/TaskIdForChildren'
      responses:
        '200':
          description: 子任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subtask'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: 添加子任务
      tags: [Subtasks]
      parameters:
        - $ref: '#/components/parameters/TaskIdForChildren'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{taskId}/subtasks/{id}:
    put:
      summary: 更新子任务（勾选 / 改名 / 排序）
      tags: [Subtasks]
      parameters:
        - $ref: '#/components/parameters/TaskIdForChildren'
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                completed:
                  type: boolean
                sort_order:
                  type: integer
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 删除子任务
      tags: [Subtasks]
      parameters:
        - $ref: '#/components/parameters/TaskIdForChildren'
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{taskId}/notes:
    get:
      summary: 获取进展笔记（时间倒序）
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/TaskIdForChildren'
      responses:
        '200':
          description: 笔记列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: 添加进展笔记
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/TaskIdForChildren'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                source:
                  type: string
                  maxLength: 50
                  default: user
                  example: ai
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{taskId}/notes/{id}:
    delete:
      summary: 删除进展笔记
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/TaskIdForChildren'
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tags:
    get:
      summary: 获取标签列表
      tags: [Tags]
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

    post:
      summary: 创建标签
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                color:
                  type: string
                  pattern: '^#[0-9a-fA-F]{6}$'
                  default: '#6366f1'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 标签名已存在

  /api/tags/{id}:
    put:
      summary: 更新标签
      tags: [Tags]
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 50
                color:
                  type: string
                  pattern: '^#[0-9a-fA-F]{6}$'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 标签名已存在

    delete:
      summary: 删除标签（同时移除任务上的关联）
      tags: [Tags]
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /api/webhooks:
    get:
      summary: 获取 Webhook 列表
      tags: [Webhooks]
      responses:
        '200':
          description: Webhook 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
    post:
      summary: 注册 Webhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name:
                  type: string
                  maxLength: 100
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                    enum: [task.created, task.updated, task.completed, task.deleted, task.overdue, '*']
                  default: [task.created, task.updated, task.overdue]
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/webhooks/{id}:
    put:
      summary: 更新 Webhook
      tags: [Webhooks]
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 删除 Webhook
      tags: [Webhooks]
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /api/backup/export:
    get:
      summary: 导出全部数据
      tags: [System]
      responses:
        '200':
          description: 备份 JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
                  data:
                    type: object

  /api/backup/import:
    post:
      summary: 导入备份（覆盖全部数据，事务执行）
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
      responses:
        '200':
          description: 导入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  imported:
                    type: object
                    additionalProperties:
                      type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
